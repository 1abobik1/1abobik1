<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Dmitriy – Fullstack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="1" stop-color="#1a0508"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff2a3d"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b3001b"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a3d" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#3a0a10" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#b3001b" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="win">
      <rect x="10" y="10" width="880" height="250" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    .dim { fill: #7a6a6c; font-size: 15px; }
    .prompt { fill: #ff2a3d; }
    .name { font-size: 58px; font-weight: 700; letter-spacing: 1px; }
    .type { fill: #e6edf3; font-size: 20px; opacity: 0; animation: type 24s infinite; }
    .cur { fill: #ff2a3d; animation: blink 0.8s steps(1) infinite; }
    .t2 { animation-delay: 4s; }  .t3 { animation-delay: 8s; }
    .t4 { animation-delay: 12s; } .t5 { animation-delay: 16s; }
    .t6 { animation-delay: 20s; }
    @keyframes type {
      0%     { opacity: 1; clip-path: inset(0 100% 0 0); animation-timing-function: steps(30, end); }
      5%     { opacity: 1; clip-path: inset(0 0 0 0); }
      14%    { opacity: 1; clip-path: inset(0 0 0 0); animation-timing-function: steps(12, end); }
      16.5%  { opacity: 1; clip-path: inset(0 100% 0 0); }
      16.6%, 100% { opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    .lbl { fill: #b8a9ab; font-size: 14px; }
    .track { fill: #2a0d11; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.6s cubic-bezier(.2,.8,.2,1) both; }
    .b2 { animation-delay: .2s; } .b3 { animation-delay: .4s; } .b4 { animation-delay: .6s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="880" height="250" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#win)" opacity="0.55">
    <circle cx="160" cy="250" r="110" fill="#c8102e" filter="url(#blur)">
      <animate attributeName="cx" values="160;360;160" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="30" r="120" fill="#6e0a17" filter="url(#blur)">
      <animate attributeName="cx" values="760;560;760" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="10.5" y="10.5" width="879" height="249" rx="16" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="38" cy="36" r="6" fill="#ff2a3d"/>
  <circle cx="58" cy="36" r="6" fill="#8a1424"/>
  <circle cx="78" cy="36" r="6" fill="#3a3a3a"/>
  <text x="450" y="41" text-anchor="middle" class="mono dim">~/1abobik1 – zsh</text>
  <line x1="10" y1="56" x2="890" y2="56" stroke="#2e0f14"/>

  <!-- left: terminal -->
  <text x="44" y="92" class="mono dim"><tspan class="prompt">$</tspan> whoami</text>
  <text x="40" y="152" class="mono name" fill="url(#accent)">Dmitriy</text>
  <text x="44" y="190" class="mono dim"><tspan class="prompt">$</tspan> cat role.txt</text>

  <g class="mono">
    <text x="44" y="226" class="type t1">› Fullstack developer<tspan class="cur">▍</tspan></text>
    <text x="44" y="226" class="type t2">› Fullstack-разработчик<tspan class="cur">▍</tspan></text>
    <text x="44" y="226" class="type t3">› Go · C++ · Python · TypeScript<tspan class="cur">▍</tspan></text>
    <text x="44" y="226" class="type t4">› Backend: highload &amp; distributed systems<tspan class="cur">▍</tspan></text>
    <text x="44" y="226" class="type t5">› Бэкенд, фронтенд, криптография, CV<tspan class="cur">▍</tspan></text>
    <text x="44" y="226" class="type t6">› Frontend: React + TypeScript<tspan class="cur">▍</tspan></text>
  </g>

  <!-- right: language bars -->
  <line x1="590" y1="76" x2="590" y2="236" stroke="#2e0f14"/>
  <g class="mono">
    <text x="620" y="92" class="dim">stack --top</text>

    <text x="620" y="124" class="lbl">Go</text>
    <rect x="720" y="114" width="140" height="10" rx="5" class="track"/>
    <rect x="720" y="114" width="140" height="10" rx="5" fill="#ff2a3d" class="bar"/>

    <text x="620" y="154" class="lbl">TypeScript</text>
    <rect x="720" y="144" width="140" height="10" rx="5" class="track"/>
    <rect x="720" y="144" width="104" height="10" rx="5" fill="#d4142e" class="bar b2"/>

    <text x="620" y="184" class="lbl">C++</text>
    <rect x="720" y="174" width="140" height="10" rx="5" class="track"/>
    <rect x="720" y="174" width="100" height="10" rx="5" fill="#a50f22" class="bar b3"/>

    <text x="620" y="214" class="lbl">Python</text>
    <rect x="720" y="204" width="140" height="10" rx="5" class="track"/>
    <rect x="720" y="204" width="92" height="10" rx="5" fill="#7a0c1a" class="bar b4"/>
  </g>
</svg>
